services:
  - type: web
    name: classroom-orchestration
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: LOCAL_DEVICE_TESTING
        value: "false"
      - key: TEACHER_CLOSE_ON_EXIT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: classroom-orchestration-db
          property: connectionString

databases:
  - name: classroom-orchestration-db
    plan: free
    region: ohio
    postgresMajorVersion: "17"
    databaseName: classroom
    user: classroom
    ipAllowList: []
